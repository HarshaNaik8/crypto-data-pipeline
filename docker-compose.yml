services:
  crypto-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_data_pipeline
    env_file:
      - .env
    volumes:
      # Mount SQLite database file to persist transactions onto the host machine
      - ./crypto_pipeline.db:/app/crypto_pipeline.db
      # Mount execution logs for local observability
      - ./logs:/app/logs
      # Mount raw and transformed audit snapshots
      - ./data:/app/data
    restart: "no"
